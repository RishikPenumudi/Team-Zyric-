steps:
  # 1. Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sahaj-ai:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/sahaj-ai:latest', '.']

  # 2. Push the images to Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sahaj-ai:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sahaj-ai:latest']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sahaj-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sahaj-ai:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SAHAJ_HARDWARE_MODE=SIMULATION'

images:
  - 'gcr.io/$PROJECT_ID/sahaj-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/sahaj-ai:latest'
